[project]
name = "spiderweb"
version = "0.1.0"
description = "LLM-powered three-layer document graph engine"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "jieba>=0.42.1",
    "mcp>=1.28.1",
    "openai>=2.44.0",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "sqlite-vec>=0.1.9",
    "voyageai>=0.4.1",
]

[project.scripts]
spiderweb = "spiderweb.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spiderweb"]
