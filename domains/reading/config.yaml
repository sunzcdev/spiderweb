chunk_overlap: 150
chunk_size: 1500
data_dir: ~/.spiderweb/reading
insights_dir: ~/notebooks/wiki/reading-graph/raw/insights
extraction:
  mode: sample
  sample_rate: 0.3
providers:
  embedding:
    dimensions: 1024
    driver: voyage
    model: voyage-4-large
  llm:
    base_url: https://api.deepseek.com/v1
    api_key_env: DEEPSEEK_API_KEY
    driver: openai
    model: deepseek-v4-flash
    fallback:
      - base_url: https://token.sensenova.cn/v1
        model: sensenova-6.7-flash-lite
        api_key_env: SENSENOVA_API_KEY
  reranker:
    driver: voyage
    model: rerank-2-lite
  tokenizer:
    driver: jieba
