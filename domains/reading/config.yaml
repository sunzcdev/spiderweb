chunk_overlap: 150
chunk_size: 1500
data_dir: ~/.spiderweb/reading
extraction:
  mode: sample
  sample_rate: 0.3
providers:
  embedding:
    dimensions: 1024
    driver: voyage
    model: voyage-4-large
  llm:
    base_url: https://api.deepseek.com/v1
    driver: openai
    model: deepseek-v4-flash
  reranker:
    driver: voyage
    model: rerank-2-lite
  tokenizer:
    driver: jieba
